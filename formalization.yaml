status:
  scope: >-
    Augmented left decalage is defined for simplicial objects in an arbitrary
    category. Its degree-zero augmentation is delta 1, whereas its simplicial
    projection is delta 0. The original zeroth degeneracies satisfy all defining
    extra-degeneracy equations. Transfers use coefficient objects in a
    preadditive category with coproducts. Equifibered simplicial maps require
    only finite vertex fibers; the induced homology map additionally requires
    homology in the coefficient category. Transfers satisfy postcomposition,
    identity and reverse-order composition, pullback base change, coefficient
    naturality and fiber-counting laws.
    A fixed vertex-fiber cardinal gives the sheet identity on chains and homology.
    Additive coefficient functors preserving the indexed coproducts commute with
    all-simplex chain transfers via the chain-complex coefficient comparison;
    no preservation of homology or exactness is required.
    Tensoring with the cyclic group of order four gives a nonzero two-sheet client
    computed independently of that compatibility theorem.
review:
  status: unchecked
alignment:
  note: >-
    Public API inventory for augmented left decalage, finite-fiber transfers and
    maps between normalized complexes of split simplicial objects, including
    projection equations, functoriality, the degreewise degeneracy-quotient property
    and agreement with the normalized functor on compatible split morphisms.
