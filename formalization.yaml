# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"
project:
  name: Simplicial Objects
  description: >-
    Functorial augmented left decalage of any simplicial object, its natural
    zeroth-face projection and canonical native five-law extra degeneracy.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Prism
  license: Apache-2.0
sources:
  - title: Standard ordinal and simplicial identities
    type: folklore
    relationship: background
    note: >-
      Mathematical input for this original Formal Frontier Lean construction;
      no named source, book chapter or source-specific coverage is asserted.
related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4
    relationship: builds-on
    note: >-
      Uses mathlib's simplex categories, augmented-object equivalence and native
      extra-degeneracy section, split-epimorphism, homotopy and transport API.
automation:
  methods:
    - method: agent
      framework: Formal Frontier agents and Lean 4
      tool_setup: >-
        AI-assisted original mathematical proof and ordinary-import private
        client, independently agent-reviewed and packaged as a standalone library.
      prompting_notes: >-
        The original proof and client were adapted through namespace/import
        relocation; package assembly added no mathematical implementation.
status:
  scope: >-
    Twenty-four original public declarations and a maintained private client
    form the initial published library. Its mathematics and release artifacts
    received independent Formal Frontier agent review; the native both-root
    build and complete transitive standard-three axiom audit include private
    and generated declarations. These historical results do not review or
    release subsequent edits, establish source-specific coverage or imply a
    topological realization theorem.
review:
  status: agent-reviewed
  reviewers:
    - Independent Formal Frontier agent reviewers
  notes: >-
    Independent agent reviews addressed the original mathematics, initial
    destination code and exact first-release artifacts. Historical native
    checks built both roots and audited all transitive standard axioms,
    including private/generated declarations. This is agent review, not
    independent human review or review of later edits; see CONTRIBUTORS.md
    for separate author, reviewer and maintainer roles.
