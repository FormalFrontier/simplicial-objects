acknowledgements: >-
  Formal Frontier agents wrote the original proof, client and guide; independent
  agents reviewed the original and destination artifacts, and separate agents
  packaged and edited them. Mathlib supplies the underlying categorical
  structures, section, split-epimorphism, generic homotopy and transport;
  authorship and role credit are in CONTRIBUTORS.md.
