# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"
project:
  name: Simplicial Objects
  description: >-
    Functorial augmented left decalage of simplicial objects with a canonical
    extra degeneracy, and finite-fiber coproduct, diagram and simplicial chain
    transfers with induced homology maps, coefficient naturality and sheet identities,
    together with normalized-chain descent and coefficient comparisons coherent
    with arbitrary coefficient-valued maps, finite-fiber transfers and transformations
    of additive coproduct-preserving functors, and an integral tensor presentation of
    normalized chains for arbitrary simplicial sets and abelian coefficient groups,
    with integral and tensor degree maps for arbitrary simplicial morphisms,
    additive functoriality and degreewise exactness in abelian coefficients,
    and chain homotopies induced by simplicial homotopies and equality of the
    corresponding induced homology maps. Simplicial homotopy inverses induce
    quasi-isomorphisms of normalized chains and of the original integral tensor
    complexes with arbitrary abelian coefficients. For terminal simplicial sets, degree-zero
    tensor homology has mutually inverse comparisons with the lifted coefficient
    object, natural in coefficients and terminal-set maps; positive-degree tensor
    homology vanishes, with dimension-bound vanishing for arbitrary simplicial sets.
    Injective and surjective coefficient maps preserve endpoints, and short exact
    coefficient pairs give short exact sequences of these chain complexes.
    For arbitrary simplicial sets, Mathlib's zeroth-homology coproduct isomorphism
    and its inverse are natural in coefficient morphisms, with an all-degree
    coefficient-generator law.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Formal Frontier source maintainers
  license: Apache-2.0
sources:
  - title: Standard ordinal and simplicial identities
    type: folklore
    relationship: background
    note: Ordinal identities underlying the augmented left decalage.
  - title: A Concise Course in Algebraic Topology
    authors:
      - J. Peter May
    type: book
    location: Revised author edition, §12.1–2, §13.1, §16.1, §16.4 and §16, Problem 3
    relationship: background
    note: >-
      Motivation for the integral tensor presentation of normalized chains,
      covering transfers and their sheet identity, and the chain-homotopy
      principle for equality of induced homology maps. Point homology and normalized
      chains motivate the terminal-simplicial-set homology comparisons and vanishing.
      The coefficient endpoint and short-exactness results use Mathlib's algebraic
      APIs, not a printed theorem about coefficient endpoints in this passage.
related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4
    relationship: builds-on
    note: >-
      Uses mathlib's simplex categories, augmented objects, extra degeneracies,
      coproducts, pullbacks, alternating-face-map chain complexes, normalized cofans,
      direct-sum and Finsupp isomorphisms, TensorProduct.finsuppScalarLeft and homology.
      Terminal-object transport, Finsupp.uniqueLinearEquiv and normalized-chain
      dimension bounds also underlie the point-homology comparisons and vanishing.
      Coefficient endpoints use functional exactness, free-Finsupp flatness and tensor
      exactness, module-category endpoint criteria and degreewise short exactness
      for homological complexes.
automation:
  methods:
    - method: agent
      framework: Formal Frontier agents and Lean 4
      tool_setup: AI-assisted Lean formalization and mathematical documentation.
status:
  scope: >-
    Augmented left decalage is defined for simplicial objects in an arbitrary
    category. Its degree-zero augmentation is delta 1, whereas its simplicial
    projection is delta 0. The original zeroth degeneracies satisfy all defining
    extra-degeneracy equations. Transfers use coefficient objects in a
    preadditive category with coproducts. Equifibered simplicial maps require
    only finite vertex fibers; the induced homology map additionally requires
    homology in the coefficient category. Transfers satisfy postcomposition,
    identity and reverse-order composition, pullback base change, coefficient
    naturality and fiber-counting laws.
    A fixed vertex-fiber cardinal gives the sheet identity on chains and homology.
    Additive coefficient functors preserving the indexed coproducts commute with
    all-simplex chain transfers via the chain-complex coefficient comparison;
    no preservation of homology or exactness is required.
    Tensoring with the cyclic group of order four gives a nonzero two-sheet client
    computed independently of that compatibility theorem.
    Normalized chains with any coefficient object R : C commute naturally with
    an additive functor L from C to D preserving coproducts indexed by every T : Type w.
    The categories C : Type u and D : Type u' have Category.{v} and Category.{v'}
    structures, are preadditive and have HasCoproducts.{w}; all five universes are
    independent. The preservation hypothesis is exactly
    ∀ T : Type w, PreservesColimitsOfShape (Discrete T) L.
    The comparison respects the normalization projection and section and has the
    canonical coefficient formula on all simplex generators, including degenerate
    zero classes. Naturality includes simplicial collapse maps. On the normalized
    interval, tensoring integral coefficients with ZMod 4 sends the nonzero source
    edge to the nonzero target edge with coefficient object Z tensor[Z] ZMod 4;
    independent edge coordinates are 1 tensor 1, and collapse annihilates both edges.
    The normalized comparison also commutes with arbitrary coefficient-valued
    simplicial morphisms, normalized finite-vertex-fiber equifibered transfers,
    and natural transformations between additive functors with the same coproduct
    preservation hypotheses. The transformation acts on the normalized source and
    coefficientwise on the target. The mixed interval map 2 id plus the constant
    vertex map, the two-sheet interval cover, and multiplication by two on the
    tensor coefficient instantiate these laws.
    Independently, for any A : Type a with AddCommGroup A and S : SSet.{w}, integral
    normalized classes lie in S.nonDegenerate n →₀ ℤ; a nondegenerate simplex gives
    its basis vector and a degenerate simplex gives zero. The integral boundary is
    the uniquely specified linear map taking each generator to the alternating sum
    of its face classes, with positive zeroth face and degenerate faces zero.
    Tensor degrees are ModuleCat.of ℤ (ULift.{max a w p}
    ((S.nonDegenerate n →₀ ℤ) tensor[ℤ] A)), using only the canonical integer module.
    The independently defined successor boundary lifts the integral boundary rTensor A;
    all other differential components vanish, and successive differentials compose to zero.
    Coefficient, simplex and padding universes a, w, p are independent, without finite,
    flat, field or nonempty assumptions. The whole normalized-degree Finsupp isomorphism
    works for any Ring R : Type r and M : ModuleCat.{max w v} R, with independent r, w, v.
    It uses the normalized cofan universal property, coproduct/direct-sum isomorphism
    and inverse Finsupp/direct-sum isomorphism. Tensor coordinates send a pure tensor
    z tensor x to the lifted family s ↦ z s • x. Composing tensor coordinates with
    inverse whole normalized coordinates gives the degree comparison to normalized
    chains with coefficient object ModuleCat.of ℤ (ULift.{max w p} A). It intertwines
    the differentials and assembles into a chain isomorphism, uniquely characterized
    on nondegenerate generators with coefficients. Its all-simplex formula includes
    zero degenerate classes; the inverse recovers nondegenerate pure tensors.
    The standard interval over ZMod 4 has nonzero terminal-minus-initial boundary.
    Pushing forward the existing two-sheet all-simplex transfer and normalizing gives
    vertex coefficient two modulo four; inverse tensor coordinates recover a nonzero
    tensor with that coefficient. Degenerate edges, outgoing degree-zero maps and empty
    sheets give zero. This calculation is not a new arbitrary tensor transfer chain map
    or naturality theorem. The integral tensor construction is distinct from the
    normalized coefficient-comparison coherence laws. No topological singular-chain
    identification or homology comparison is asserted.
    For any simplicial morphism f : S → T in SSet.{w}, the integral degree map
    sends a nondegenerate basis vector to the normalized integral class of its image,
    possibly zero. Its tensor-degree map is the lifted right tensor with the identity
    on A. Generator, all-simplex and uniqueness laws characterize these operations.
    Whole chain maps conjugate Mathlib's normalized-chain map by the existing tensor
    chain comparisons and form a functor. The component-identification and naturality
    statements compare this functor with the independent tensor-degree operations and
    alternating differential, including degenerate images. Only morphisms are
    conjugated; the tensor carriers and independent boundary are unchanged.
    The coefficient, simplex and padding universes remain independent, with no
    injectivity, finite-fiber, flatness or nonemptiness hypothesis.
    Change of abelian coefficients is defined for every additive homomorphism
    A →+ B, with independent a, b, w, p and balanced source and target padding.
    The degree operation is the integral identity tensored with the coefficient map;
    the chain morphism conjugates the normalized coefficient morphism by the tensor
    comparison. Both have generator, uniqueness, identity and composition laws.
    The degree and whole comparisons are natural in coefficients, the raw
    tensor operation commutes with the alternating boundary, and the chain
    morphism has the raw operation as each component. Reduction modulo two kills a nonzero
    coefficient-two tensor and preserves a nonzero coefficient-one tensor on the
    standard interval, whose reduced edge has nonzero boundary independently.
    The raw coefficient operation and coefficient chain morphism preserve addition
    of arbitrary additive homomorphisms A →+ B, with independent a, b, w, p,
    source padding max b p and target padding max a p. The coefficient-curried
    functor from AddCommGrpCat.{a} to SSet.{w} ⥤ ChainComplex (ModuleCat.{max a w p} ℤ) ℕ
    uses the existing fixed-coefficient functors and coefficient morphisms, both
    with common padding max a p. Its five characteristic equations identify the
    fixed-coefficient object, tensor complex, simplicial map, coefficient component
    and raw degree map. Its Functor.Additive instance gives addition and Mathlib's
    generic additive-functor laws, including preservation of zero morphisms.
    The same interval computations give a nonzero coefficient-one image and reduced
    edge boundary, and show that doubling sends one to a nonzero coefficient-two
    tensor which reduction modulo two kills.
    An exact pair of additive coefficient homomorphisms induces an exact pair of
    the existing tensor-degree maps for every simplicial set and degree. The three
    coefficient groups are arbitrary abelian groups in independent universes.
    Mathlib's Module.Flat.lTensor_exact uses the free first factor
    S.nonDegenerate n →₀ ℤ; only the existing outer lifts use common padding
    max a b c w p. No coefficient-flatness, finiteness, injectivity or surjectivity
    assumption is required. Integer doubling followed by reduction modulo two
    specializes this exactness result to the standard point and interval.
    The mixed naturality statements express that arbitrary simplicial morphisms
    and arbitrary additive coefficient homomorphisms commute, in raw tensor degrees
    and as whole chain morphisms, with the same balanced padding and original
    alternating differentials. Collapse of the standard interval with coefficient
    doubling modulo four sends a coefficient-one vertex to a nonzero coefficient-two
    vertex independently of the mixed statements.
    Combinatorial and cylinder simplicial homotopies give Mathlib chain homotopies
    between the original tensor maps, with the component formula through the existing
    tensor comparisons and normalization section and projection. Coefficients use
    exactly ModuleCat.of ℤ (ULift.{max w p} A), with canonical structures and only
    AddCommGroup A. The constructed chain homotopies give equal induced maps
    on natural-number-graded homology. Their data and characteristic API are
    independent of this homology consequence.
    A simplicial map with a two-sided simplicial homotopy inverse induces a
    quasi-isomorphism of normalized chains in every preadditive coefficient category
    with coproducts and homology, without an abelian-category hypothesis.
    The original tensor chain map is a quasi-isomorphism for arbitrary abelian
    coefficients and independent coefficient, simplex and padding universes.
    The standard interval augmentation supplies a closed example of each result
    over ZMod 4, while identifying distinct vertices in degree zero.
    The point-to-interval cylinder over ZMod 4 has distinct endpoint chain images
    and sends the point generator to the negative edge tensor. Its nonzero control
    uses the independently calculated terminal-minus-initial boundary.
    For every abelian A : Type a and terminal T : SSet.{w}, the comparisons between
    degree-zero homology of the original K = tensorNormalizedChainComplex.{a,w,p} A T
    and C = ModuleCat.of ℤ (ULift.{max w p} A) are mutually inverse.
    The coefficient, simplex and padding universes a, w, p are independent;
    C lies in ModuleCat.{max a w p} ℤ, and its coefficient lift is distinct from the
    raw degree carrier ULift.{max a w p} ((T.nonDegenerate n →₀ ℤ) tensor[ℤ] A).
    The forward comparison sends the homology class of every original vertex tensor
    to its lifted coefficient, and the reverse comparison recovers that class.
    Coefficient naturality holds for every additive homomorphism A →+ B, with
    independent coefficient universes a, b, source padding max b p and target
    padding max a p, and lifted coefficient arrow up x ↦ up (g x).
    The comparison is also natural for arbitrary maps between terminal simplicial sets.
    All positive homology H_(n+1) of K vanishes. More generally, S.HasDimensionLT d
    implies zero tensor homology in every degree n ≥ d, for any simplicial set S.
    These point statements concern simplicial normalized chains and nonnegatively
    indexed ordinary homology only, with no TopCat or singular-chain comparison,
    reduced or relative homology, long exact sequence, or all-results claim for the
    cited sections of May's book.

    Exact additive coefficient pairs give exact tensor-degree maps by flatness of
    the free integral simplex factor, without flatness of the coefficients.
    Injective and surjective coefficient maps give injective and surjective degree
    maps and monomorphisms and epimorphisms of the original chain complexes.
    An exact coefficient pair defines a short complex in ModuleCat.{max a b c w p} ℤ
    chain complexes, with independent coefficient, simplex and padding universes.
    Seven characteristic equations identify its three objects, both arrows and both
    raw degree components. Injectivity of the first coefficient map and surjectivity
    of the second make it short exact. The zero coefficient map gives the zero chain
    map. Integer doubling and reduction modulo two specialize all five endpoint and
    short-exactness statements to the same standard point and interval, whose short
    complexes retain nonzero integer and reduced vertex generators.
    For arbitrary S : SSet.{w} and R R' : C, every morphism a : R ⟶ R' commutes
    with Mathlib's homology₀Iso and its inverse. The category C : Type u has
    Category.{v}, HasCoproducts.{w}, Preadditive and CategoryWithHomology, with
    independent u, v, w. The squares use the original chainComplexFunctor.map/app,
    homologyMap in degree zero and Sigma.map on the fixed index π₀ S.
    The all-degree ιChainComplex coefficient-generator law and its reassociated
    form need no CategoryWithHomology. On the standard point, the two squares
    are evaluated on the nonzero integer vertex class and coefficient-one component
    generator, using the same lifted integer reduction modulo two that kills two
    and preserves one; the augmentation detects the integer class.
    These ordinary simplicial homology laws are separate from normalized tensor
    homology and assert no TopCat, singular, relative or reduced comparison.
    This inventory is not a source-passage coverage map.
review:
  status: unchecked
alignment:
  note: >-
    Public API inventory for augmented left decalage, finite-fiber transfers and
    maps between normalized complexes of split simplicial objects, including
    projection equations, functoriality, the degreewise degeneracy-quotient property
    and agreement with the normalized functor on compatible split morphisms.
    The normalized-chain coefficient natural isomorphism is indexed together with
    its projection, section and all-simplex generator characteristic equations.
    The integral tensor presentation is indexed with its independent boundary,
    whole normalized-degree and tensor coordinates, differential shape and square-zero,
    chain isomorphism, generator and inverse laws, extensionality and uniqueness.
    Simplicial maps are indexed with integral and tensor-degree characteristic laws,
    the whole chain map and functor, and their component and naturality statements.
    Change of abelian coefficients is indexed with raw and chain-map additivity,
    the coefficient-curried functor, its five characteristic equations and its
    additive-functor instance. Terminal-set homology is indexed with its two
    degree-zero comparisons, both inverse identities, vertex-class characteristic
    equations, balanced coefficient naturality, terminal-map naturality and
    positive-degree and dimension-bound vanishing.

    Coefficient maps are indexed with degreewise exactness, injectivity and
    surjectivity, the zero chain map, chain monomorphisms and epimorphisms, and the
    coefficient short complex with its seven characteristic equations and short
    exactness statement. Ordinary zeroth simplicial homology is indexed with the
    all-degree coefficient-generator law, its generated reassociated form, and
    coefficient naturality of Mathlib's homology₀Iso in both directions.
