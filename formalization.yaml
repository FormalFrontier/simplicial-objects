acknowledgements: >-
  Formal Frontier agents contributed the formalization and documentation; see
  CONTRIBUTORS.md for authorship and role credit. Mathlib supplies the underlying
  categorical structures, extra-degeneracy section, split-epimorphism, homotopy
  and transport, normalized cofan universal property, coproduct/direct-sum and
  Finsupp isomorphisms, tensor coordinates, and chain-complex and homology APIs.
  Mathlib also supplies free-module flatness, tensor-product exactness,
  LinearMap.lTensor_add, AddCommGrpCat, additive functors, and the pointwise
  preadditive structures on chain complexes and functor categories.
  Kim Morrison's chain-homotopy composition and homology-invariance API and
  Fabian Odermatt and Joël Riou's
  simplicial homotopy constructions supply the homotopies; Joël Riou's normalization
  and cylinder-to-combinatorial constructions are reused without a new prism engine.
  The point-homology constructions use Mathlib's categorical homology, dimension
  bounds, Finsupp.uniqueLinearEquiv and terminal-object transport, together with
  the existing integral tensor-chain and coefficient-map formalization in this library.

  The coefficient endpoints reuse the existing degree-exactness proof using
  Mathlib's Module.Flat.finsupp and Module.Flat.lTensor_exact; functional exactness,
  module-category endpoint criteria and degreewise short exactness supply the
  endpoint and short-exact-sequence packaging.
  The ordinary zeroth-homology coefficient laws follow Mathlib's simplicial
  homology and homology₀Iso API by Joël Riou and Andrew Yang, together with its
  categorical coproduct and isomorphism APIs.
