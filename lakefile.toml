name = "simplicial-objects"
version = "0.1.0"
lintDriver = "batteries/runLinter"
defaultTargets = ["SimplicialObjects", "SimplicialObjectsTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "projective-modules"
git = "https://github.com/FormalFrontier/projective-modules.git"
rev = "08efdc3703d199727871d0f3dbd5d3c9c4fde8bb"

[[lean_lib]]
name = "SimplicialObjects"

[[lean_lib]]
name = "SimplicialObjectsTest"

# Verification declarations are intentionally private.
[lean_lib.leanOptions]
weak.linter.privateModule = false
